# A conflicting PR must not look merely under-checked (forge#307 seam 1).
#
# ════ DO NOT EDIT THIS FILE IN A PRODUCT REPO. ════ (VENDORED variant — see
# .github/actions/pr-review/VENDORED_FROM) Copied byte-for-byte from forge's
# .github/actions/pr-review/callers/pr-mergeable.yml.
#
# When a branch conflicts with its base, GitHub cannot build a merge commit and NO
# `pull_request` workflow runs — not the review, not the payload check, not the deploy — and
# nothing says why. `pull_request_target` fires regardless, so this check goes red and
# comments instead.
#
# SAFE UNDER pull_request_target because it never checks out or runs the PR's code: it reads
# PR metadata and writes one comment. Do not add a checkout here.
name: PR mergeable

on:
  pull_request_target:
    # `edited` covers a base-branch change.
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  mergeable:
    runs-on: ubuntu-latest
    steps:
      # VENDORED (forge#307): this repo cannot resolve forge's private actions, so it runs a
      # copy at .github/actions/pr-review/ — checked out from the PR's BASE commit, never
      # from the PR under review, so a PR cannot rewrite the reviewer judging it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-actions
          sparse-checkout: .github/actions/pr-review
          persist-credentials: false
      - uses: ./.review-actions/.github/actions/pr-review/mergeable
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
