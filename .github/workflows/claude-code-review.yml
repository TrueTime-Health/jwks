# AI code review on every PR — the fleet's THIN CALLER (forge#307).
#
# ════ DO NOT EDIT THIS FILE IN A PRODUCT REPO. ════ (VENDORED variant — see
# .github/actions/pr-review/VENDORED_FROM)
# It is copied byte-for-byte from TrueTime-Health/forge
#   .github/actions/pr-review/callers/claude-code-review.yml
# and every decision it runs lives in forge's .github/actions/pr-review/. Eighteen hand-kept
# copies of the old 460-720 line workflow drifted into eleven variants; a fix now lands once,
# in forge, and reaches every repo by bumping the one pinned SHA below.
#
# Repo-specific needs (a reviewer that runs the suite, extra prompt text, an override
# allowlist) go in .github/pr-review.json, read from the BASE branch — see forge's
# .github/actions/pr-review/README.md.
#
# What stays here is only what GitHub needs at the JOB level: triggers, concurrency, job
# `needs`/`outputs`, and the required-check names `review` and `gate`. The shared logic is
# composite actions rather than a reusable workflow for exactly that last reason: a reusable
# workflow renames its checks to `<caller> / gate`, which would strand every repo's branch
# protection.
#
# PINNED TO A FORGE COMMIT SHA, and every forge ref in this file carries the SAME one. The
# org's Actions policy requires full-length SHAs for EVERY action, first-party included —
# `@main` was rejected outright on the pilot (forge#310). So a reviewer fix lands once in
# forge, then reaches each repo by bumping this one SHA (the same bump everywhere; a test in
# forge checks the refs agree). A pin also means a forge PR that changes the reviewer is
# never judged by the version it proposes.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN, an org secret minted from the CEO's Claude subscription.
# PHI POSTURE — load-bearing: that lane has NO BAA. These jobs only ever receive the repo
# checkout and the PR diff: no database, no PHI bucket, no production project, no cloud
# credentials. That is why the no-real-PHI-in-repos rule is absolute.
name: Claude PR Review

on:
  pull_request:
    # `labeled`/`unlabeled` re-run the gate when a human applies or withdraws
    # review:override or review:unverified-ok. `ready_for_review` re-runs a PR taken out of
    # draft (a draft skips the review, so its gate fails closed with no run timestamp).
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

# Label events get their own lane. Dependabot fires ~4 `labeled` events within seconds of
# opening a PR; with one shared group and cancel-in-progress, a label run could cancel the
# real code review (38 of 50 Dependabot PRs blocked that way, 2026-08-25). GitHub applies
# concurrency BEFORE any job `if`, so the job guard below cannot prevent that on its own.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write
  # The gate ties a verdict to a commit by reading the run that wrote it
  # (GET /actions/runs/{id} -> head_sha). Without this every verdict is untieable and
  # every PR blocks with 'could not read run ... 403' (forge#311).
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    # A label event carries no new code, and on it claude-code-action cannot post a verdict
    # anyway — reviewing would bill a full review to produce nothing. The gate re-asserts
    # the verdict already recorded for the head commit instead.
    #
    # KNOWN DEPENDENCY: this job then reports "skipped" for the head SHA, and `review` is a
    # required check. GitHub treats a skipped required check as passing, which is what lets
    # a label event leave the PR mergeable. That is safe ONLY because `gate` — also required,
    # and never skipped — independently re-derives the decision on every event; `review`
    # passing has never meant "approved" (the review step is continue-on-error). If GitHub
    # ever stops counting skipped as passing, label events will leave PRs pending until the
    # next push: fail-closed, not fail-open.
    if: >-
      github.event.pull_request.draft == false &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
       (github.event.action == 'labeled' && github.event.label.name == 'review:override'))
    outputs:
      run_started: ${{ steps.start.outputs.run_started }}
      escalate: ${{ steps.start.outputs.escalate }}
      primary: ${{ steps.start.outputs.primary }}
      fallback: ${{ steps.start.outputs.fallback }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # VENDORED (forge#307): this repo cannot resolve forge's private actions, so it runs a
      # copy at .github/actions/pr-review/ — checked out from the PR's BASE commit, never
      # from the PR under review, so a PR cannot rewrite the reviewer judging it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-actions
          sparse-checkout: .github/actions/pr-review
          persist-credentials: false
      - id: start
        uses: ./.review-actions/.github/actions/pr-review/start
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          forge_url: ${{ secrets.FORGE_URL }}
          forge_api_key: ${{ secrets.FORGE_API_KEY }}
      # The review REPORTS; the gate DECIDES — so this step may fail without failing the job.
      - name: Claude review (primary model)
        if: steps.start.outputs.escalate != 'true'
        continue-on-error: true
        uses: ./.review-actions/.github/actions/pr-review/review
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ steps.start.outputs.primary }}

  # Its own job, not a second step: claude-code-action's post-step revokes its App token, so
  # a second invocation in the same job inherits a dead credential (forge#90/#91).
  fallback_review:
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.escalate != 'true'
    outputs:
      primary_answered: ${{ steps.primary.outputs.has_verdict }}
      fallback_posted: ${{ steps.fallback.outputs.has_verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # VENDORED (forge#307): this repo cannot resolve forge's private actions, so it runs a
      # copy at .github/actions/pr-review/ — checked out from the PR's BASE commit, never
      # from the PR under review, so a PR cannot rewrite the reviewer judging it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-actions
          sparse-checkout: .github/actions/pr-review
          persist-credentials: false
      - id: primary
        uses: ./.review-actions/.github/actions/pr-review/has-verdict
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_started: ${{ needs.review.outputs.run_started }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          check_credentials: "true"
      # Only on the ABSENCE of a verdict — never as a second opinion on an unwelcome one.
      - name: Claude review (fallback model — primary could not answer)
        if: steps.primary.outputs.has_verdict == 'false'
        continue-on-error: true
        uses: ./.review-actions/.github/actions/pr-review/review
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: ${{ needs.review.outputs.fallback }}
      - id: fallback
        if: always() && steps.primary.outputs.has_verdict == 'false'
        uses: ./.review-actions/.github/actions/pr-review/has-verdict
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          run_started: ${{ needs.review.outputs.run_started }}
          on_missing: unknown

  # Runs LAST and ALWAYS. `gate` is a required check: it must publish a real conclusion on
  # every event, never "skipped" — whether a skipped required check counts as satisfied is
  # not something this design may depend on.
  gate:
    runs-on: ubuntu-latest
    needs: [review, fallback_review]
    if: always()
    steps:
      # VENDORED (forge#307): this repo cannot resolve forge's private actions, so it runs a
      # copy at .github/actions/pr-review/ — checked out from the PR's BASE commit, never
      # from the PR under review, so a PR cannot rewrite the reviewer judging it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .review-actions
          sparse-checkout: .github/actions/pr-review
          persist-credentials: false
      - uses: ./.review-actions/.github/actions/pr-review/gate
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          forge_url: ${{ secrets.FORGE_URL }}
          forge_api_key: ${{ secrets.FORGE_API_KEY }}
          run_started: ${{ needs.review.outputs.run_started }}
          escalate: ${{ needs.review.outputs.escalate }}
          primary: ${{ needs.review.outputs.primary }}
          fallback: ${{ needs.review.outputs.fallback }}
          primary_answered: ${{ needs.fallback_review.outputs.primary_answered }}
          fallback_posted: ${{ needs.fallback_review.outputs.fallback_posted }}
