# AI code review on every PR — the missing human step.
#
# Until now nothing read a diff before it merged: branch protection requires a PR but zero
# approvals, so an agent could write, merge and ship its own code with only the test suite
# and Forge's deterministic scanners in between. Those check whether the code RUNS and
# whether it matches known-bad patterns; neither asks "is this change correct, and does it
# do what the PR says". This does.
#
# Auth: CLAUDE_CODE_OAUTH_TOKEN, an org secret minted from the CEO's Claude subscription
# (`claude setup-token`) — subscription-billed, NOT metered API.
#
# PHI POSTURE — load-bearing: the subscription lane has NO BAA. This job only ever receives
# the repo checkout and the PR diff. It has no database, no PHI bucket, no production
# project, and no cloud credentials of any kind. That is exactly why the no-real-PHI-in-
# repos rule is absolute: a fixture containing a real patient would be the one way PHI
# could reach this lane.
name: Claude PR Review

on:
  pull_request:
    # `labeled` is load-bearing: the review:override escape hatch is applied as a label, and
    # without this trigger nothing re-runs the check afterwards — the override would be
    # inert, which is how the gate deadlocked its own PR the first time it was armed.
    types: [opened, synchronize, reopened, labeled]

# Cancel the previous review when new commits land — reviewing a stale diff wastes
# subscription quota and can post findings the author already fixed.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    outputs:
      # Exported so the fallback and gate jobs, which run on FRESH runners, can see
      # what this one decided. Job outputs are the only channel between jobs.
      run_started: ${{ steps.t0.outputs.at }}
      primary: ${{ steps.models.outputs.primary }}
      fallback: ${{ steps.models.outputs.fallback }}
      escalate: ${{ steps.rounds.outputs.escalate }}
    # Skip docs-only and bot-noise PRs; a prose change does not need a code review.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # WHEN DID THIS RUN START — the anchor that makes a verdict belong to THIS commit.
      #
      # Every verdict read below took the LAST claude[bot] comment on the pull request. On
      # a `synchronize` re-run that is often a verdict from the PREVIOUS commit, and the
      # consequence fails OPEN — the one direction this gate must never fail:
      #
      #   run 1 posts REVIEW: PASS -> author pushes a new commit -> run 2's reviewer
      #   crashes and posts nothing -> the read finds the STALE PASS -> the fallback is
      #   skipped, the gate unblocks the merge, and the stamp credits a model that never
      #   saw the new code. An unreviewed commit merges behind a green check.
      #
      # Found by the Opus fallback reviewing its own machinery on forge#91.
      #
      # Recorded BEFORE any review step, so a comment posted by this run always sorts at
      # or after it. Clock skew can only EXCLUDE a borderline comment, which blocks — the
      # safe direction.
      - name: Mark run start
        id: t0
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # HARD STOP (CEO, 2026-08-06). Count how many times the reviewer has already blocked
      # this PR. At the cap it stops re-reviewing, emails Sumit, and the PR waits for a human.
      # Without this the loop is unbounded: a wrong reviewer plus an author who keeps "fixing"
      # a non-issue would spin forever on the CEO's subscription quota. The GATE below still
      # fails closed, so an escalated PR stays BLOCKED — this ends the arguing, not the
      # protection.
      - name: Count prior blocking reviews
        id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          N=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate                 --jq '[.[] | select(.user.login == "claude[bot]")
                           | select(.body | contains("REVIEW: ISSUES"))] | length')
          echo "bounces=$N" >> "$GITHUB_OUTPUT"
          CAP=${REVIEW_ESCALATE_AFTER:-7}
          if [ "$N" -ge "$CAP" ]; then
            echo "escalate=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Blocked $N times — the reviewer is standing down and escalating."
          else
            echo "escalate=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Escalate to a human and stand down
        if: steps.rounds.outputs.escalate == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          N: ${{ steps.rounds.outputs.bounces }}
        run: |
          set -euo pipefail
          # Posted by the ACTIONS bot, not claude[bot], and it deliberately carries no
          # "REVIEW:" verdict line — so the gate below still reads the 7th ISSUES verdict and
          # keeps the merge blocked. An escalation must never read as a pass.
          gh api "repos/${{ github.repository }}/issues/${PR}/comments" -f body="$(cat <<MSG
          🛑 **Review loop stopped after ${N} rounds.**

          The reviewer has blocked this PR ${N} times and is standing down — after this many
          rounds, either the finding is wrong or the fix keeps missing it, and another round
          cannot settle that.

          **The merge is still blocked.** This ends the arguing, not the protection.

          Sumit has been emailed. In Forge → **PR Review** he can read the findings, ask
          OpenAI for an independent second opinion, or override with a reason.
          MSG
          )" >/dev/null
          curl -fsS --max-time 20 -X POST "${{ secrets.FORGE_URL }}/api/v1/review-escalation"             -H "Content-Type: application/json"             -H "X-Forge-API-Key: ${{ secrets.FORGE_API_KEY }}"             -d "$(python3 -c "
          import json, os
          print(json.dumps({
            'repo': '${{ github.repository }}',
            'number': int(os.environ['PR']),
            'bounces': int(os.environ['N']),
            'title': '''${{ github.event.pull_request.title }}'''[:200],
            'url': '${{ github.event.pull_request.html_url }}',
          }))
          ")" || echo "::warning::escalation email call failed — the PR is still blocked"

      # WHICH MODELS REVIEW — asked of Forge, not hardcoded here.
      #
      # The pins used to live in seventeen copies of this file, so moving to a stronger
      # model meant seventeen edits and in practice never happened. Forge now holds the
      # pair and the CEO changes it in the console: one edit, whole fleet, next run.
      #
      # NEVER BLOCKING. If Forge is unreachable, slow, or returns nonsense, the defaults
      # below are used. This lookup decides WHICH model reviews, never WHETHER review
      # happens — a convenience feature must not become a single point of failure for
      # every merge in the estate.
      - name: Resolve reviewer models
        id: models
        env:
          FORGE_URL: ${{ secrets.FORGE_URL }}
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
        run: |
          set -euo pipefail
          PRIMARY="claude-fable-5"; FALLBACK="claude-opus-5"; SRC="workflow defaults"
          if [ -n "${FORGE_URL:-}" ] && [ -n "${FORGE_API_KEY:-}" ]; then
            RESP=$(curl -fsS --max-time 10 -H "X-Forge-API-Key: ${FORGE_API_KEY}"                      "${FORGE_URL}/api/v1/reviewer-models" 2>/dev/null || true)
            if [ -n "$RESP" ]; then
              P=$(printf '%s' "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('primary',''))" 2>/dev/null || true)
              F=$(printf '%s' "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin).get('fallback',''))" 2>/dev/null || true)
              if [ -n "$P" ] && [ -n "$F" ]; then PRIMARY="$P"; FALLBACK="$F"; SRC="forge"; fi
            fi
          fi
          echo "primary=$PRIMARY" >> "$GITHUB_OUTPUT"
          echo "fallback=$FALLBACK" >> "$GITHUB_OUTPUT"
          echo "Reviewer models — primary=$PRIMARY fallback=$FALLBACK (source: $SRC)"

      - name: Claude review (primary model)
        id: fable
        if: steps.rounds.outputs.escalate != 'true'
        uses: anthropics/claude-code-action@v1
        # The review step REPORTS; the gate below DECIDES. Never let this step's exit code
        # be the merge verdict: it fails for reasons that have nothing to do with the code
        # (the workflow-validation guard, an unsupported event, quota). Those must all land
        # on the gate's fail-closed path, not turn into an unexplained red X.
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # POLICY (CEO, 2026-08-05): the review runs on the BEST AVAILABLE MODEL, currently
          # Fable 5. The reviewer is the last thing standing between generated code and
          # staging, and it is reading work written by a peer model — economising here buys
          # a cheaper opinion on exactly the judgement that matters most. Revisit this pin
          # whenever a stronger model ships; it is meant to be moved UP, never down.
          claude_args: "--model ${{ steps.models.outputs.primary }}"
          # Diagnostics: the first run completed in 2s, posted nothing, and reported an
          # empty MODE — with output suppressed there was no way to see why. A review that
          # silently does nothing while reporting success is the exact failure class this
          # workflow exists to catch, so it must not be able to hide.
          show_full_output: true
          # Unsupported on `labeled` — which is exactly the event the override hatch fires
          # on, so leaving it true errored the step on every override run.
          track_progress: ${{ github.event.action != 'labeled' }}
          # EVERY PR in this fleet is authored by truetime-helper[bot] — the agent identity
          # all automated work commits under. The action refuses non-human actors by default
          # (a sane anti-loop guard), so without this it fails 100% of our PRs with
          # "Workflow initiated by non-human actor". Named explicitly rather than "*": an
          # unknown bot opening a PR should still be refused.
          allowed_bots: "truetime-helper[bot],truetime-helper"
          prompt: |
            Review this pull request as a senior engineer at a HIPAA-regulated home-health
            software company. You did NOT write this code — read it with fresh eyes and
            assume nothing about the author's intent beyond what the diff and PR body say.

            Focus, in priority order:
            1. CORRECTNESS — will this do what the PR claims? Off-by-one, wrong branch,
               swallowed exception, a guard that does not guard, a control that is declared
               but never wired (this codebase has shipped that exact bug three times: an
               archive that never wrote, a rate limit never enforced, a cron never created).
            2. SECURITY — auth/ownership checks on data routes, untrusted input reaching a
               prompt or a query, secrets in code, anything widening access.
            3. PHI SAFETY — real patient data in fixtures or tests (must NEVER exist),
               PHI in logs, error messages, or anything leaving the service.
            4. SILENT FAILURE — can this fail and look identical to success? Say so.
            5. TESTS — do they actually assert the behaviour, or only that nothing threw?

            Ignore style and formatting. Do not restate what the diff does.

            Post ONE review comment. Start with a verdict line, exactly one of:
              REVIEW: PASS   — nothing blocking
              REVIEW: ISSUES — one or more findings that should be fixed before merge
            Then list only real findings, worst first, each with file:line and a concrete
            fix. If you find nothing, say so in one sentence — do not invent findings to
            look useful. If the diff is too large to review carefully, say THAT rather
            than skimming.


      # DID FABLE ACTUALLY PRODUCE A VERDICT?
      #
      # The distinction this whole step turns on: a review that found problems is a
      # RESULT, and must stand. A review that never ran — exhausted subscription budget,
      # a 1-second crash, an infra blip — is an ABSENCE, and blocks every merge in the
      # fleet because the gate below fails closed. On 2026-08-09 that absence stopped all
      # deploys estate-wide while the code was fine.

  # THE FALLBACK LIVES IN ITS OWN JOB — this is the fix, not a tidy-up.
  #
  # claude-code-action mints a GitHub App token and its post-step REVOKES it, so a second
  # invocation in the SAME job inherits a dead credential. Observed on forge#90/#91:
  # with track_progress on, `git fetch` dies with "Authentication failed" and the model is
  # never reached; with it off, the model DOES review but there is no tracking comment to
  # write into, so the verdict reaches the log and nowhere else. No combination of flags
  # fixes both, because the problem is the shared job.
  #
  # A separate job gets a fresh checkout and a fresh token, so the fallback behaves exactly
  # like the primary — which is the only version of "fallback" worth having.
  fallback_review:
    runs-on: ubuntu-latest
    needs: review
    if: needs.review.outputs.escalate != 'true'
    outputs:
      # Sourced from the STEP inside this job. (A global rewrite briefly made this
      # reference itself — it parsed as valid YAML and would have resolved to empty,
      # so the gate would have mis-attributed every review. Caught by checking what the
      # expression resolved to rather than that the file parsed.)
      used_fallback: ${{ steps.verdict_check.outputs.has_verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the preferred model return a verdict?
        id: verdict_check
        if: needs.review.outputs.escalate != 'true'
        env:
          RUN_STARTED: ${{ needs.review.outputs.run_started }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]") | select(.created_at >= "'"${RUN_STARTED}"'")] | last | .body // ""')
          if printf '%s' "$BODY" | grep -qE "REVIEW: (PASS|ISSUES)"; then
            echo "has_verdict=true" >> "$GITHUB_OUTPUT"
            echo "Fable returned a verdict — no fallback."
          else
            echo "has_verdict=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Fable produced no verdict — falling back to Opus 5."
          fi

      # FALLBACK — Opus 5, and ONLY when there is no verdict at all.
      #
      # POLICY (CEO, 2026-08-10): the review always ATTEMPTS the best available model
      # (Fable 5) first and only drops to Opus 5 when Fable could not answer. Reviewing is
      # the last thing between generated code and staging, so the strongest reader gets
      # first refusal every single run — this is a fallback, never a replacement, and the
      # order must not be flipped for cost.
      #
      # THE SAFETY PROPERTY, which is the reason for the verdict check above: this must
      # NEVER be a second opinion on a verdict Fable already gave. If Fable said ISSUES and
      # Opus were asked afresh, the gate would be reading whichever model happened to be
      # kinder — model-shopping until something passes, which quietly inverts the control.
      # So it fires only on ABSENCE of a verdict, never on an unwelcome one.

      - name: Claude review (fallback model — primary could not answer)
        id: opus
        if: >-
          steps.verdict_check.outputs.has_verdict == 'false'
        uses: anthropics/claude-code-action@v1
        continue-on-error: true
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model ${{ needs.review.outputs.fallback }}"
          show_full_output: true
          # RESTORED, now that this runs in its own job.
          #
          # The history is the argument for the job split. In the shared job this had to be
          # false: track_progress runs `git fetch`, and the primary's post-step had already
          # revoked the App token, so the fetch died with "Authentication failed" and the
          # model was never reached. Setting it false fixed that and broke the other half —
          # the model reviewed, but with no tracking comment to write into, posting the
          # verdict was denied and the review reached the log and nowhere else.
          #
          # No flag combination fixes both, because the problem was the shared token. With
          # a fresh job the fetch succeeds AND the comment exists, so the fallback finally
          # behaves exactly like the primary.
          track_progress: ${{ github.event.action != 'labeled' }}
          allowed_bots: "truetime-helper[bot],truetime-helper"
          prompt: |
            Review this pull request as a senior engineer at a HIPAA-regulated home-health
            software company. You did NOT write this code — read it with fresh eyes and
            assume nothing about the author's intent beyond what the diff and PR body say.

            Focus, in priority order:
            1. CORRECTNESS — will this do what the PR claims? Off-by-one, wrong branch,
               swallowed exception, a guard that does not guard, a control that is declared
               but never wired (this codebase has shipped that exact bug three times: an
               archive that never wrote, a rate limit never enforced, a cron never created).
            2. SECURITY — auth/ownership checks on data routes, untrusted input reaching a
               prompt or a query, secrets in code, anything widening access.
            3. PHI SAFETY — real patient data in fixtures or tests (must NEVER exist),
               PHI in logs, error messages, or anything leaving the service.
            4. SILENT FAILURE — can this fail and look identical to success? Say so.
            5. TESTS — do they actually assert the behaviour, or only that nothing threw?

            Ignore style and formatting. Do not restate what the diff does.

            Post ONE review comment. Start with a verdict line, exactly one of:
              REVIEW: PASS   — nothing blocking
              REVIEW: ISSUES — one or more findings that should be fixed before merge
            Then list only real findings, worst first, each with file:line and a concrete
            fix. If you find nothing, say so in one sentence — do not invent findings to
            look useful. If the diff is too large to review carefully, say THAT rather
            than skimming.

      # WHO REVIEWED THIS — stamped onto the PR, because the console could not tell.
      #
      # Both steps post as claude[bot], so a review that quietly fell back to the weaker
      # model looked identical to one from the primary. That matters for exactly the
      # judgement this gate exists to make: "the reviewer passed it" means something
      # different depending on which reviewer. Now the answer is on the PR itself, which
      # is also the only place the Forge console can read it from.

  # Attribution and enforcement run LAST, after the fallback has had its turn. `needs` is
  # what guarantees that ordering — previously these were steps in one job and the gate
  # could only ever see whatever had happened so far in that job.
  gate:
    runs-on: ubuntu-latest
    needs: [review, fallback_review]
    if: always()
    steps:
      - name: Record which model reviewed
        if: always() && needs.review.outputs.escalate != 'true'
        env:
          RUN_STARTED: ${{ needs.review.outputs.run_started }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          PRIMARY: ${{ needs.review.outputs.primary }}
          FALLBACK: ${{ needs.review.outputs.fallback }}
          USED_FALLBACK: ${{ needs.fallback_review.outputs.used_fallback }}
        run: |
          set -euo pipefail
          # ONLY stamp when a model actually produced a verdict.
          #
          # The first version inferred the fallback from "the primary returned no verdict",
          # and immediately lied: on a PR that edits this workflow the platform SKIPS both
          # review steps, so there is no verdict from anyone — and the stamp cheerfully
          # announced "reviewed by <fallback>". A provenance record that invents a reviewer
          # is worse than none: it is the looks-like-it-worked failure this stamp exists to
          # remove, wearing the stamp's own badge.
          #
          # So the stamp is driven by what is ON the PR, not by what we assume happened.
          BODY=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]") | select(.created_at >= "'"${RUN_STARTED}"'")] | last | .body // ""')
          if ! printf '%s' "$BODY" | grep -qE "REVIEW: (PASS|ISSUES)"; then
            echo "::warning::No verdict from any model — nothing to attribute, so no stamp."
            exit 0
          fi
          if [ "${USED_FALLBACK}" = "false" ]; then
            MODEL="${FALLBACK}"; NOTE=" (fallback — ${PRIMARY} returned no verdict)"
          else
            MODEL="${PRIMARY}"; NOTE=""
          fi
          gh api "repos/${{ github.repository }}/issues/${PR}/comments"             -f body="🤖 REVIEWED-BY: \`${MODEL}\`${NOTE}" >/dev/null ||             echo "::warning::could not stamp the reviewing model onto the PR"

      # THE GATE. The review step above always succeeds — it posts a comment and exits. This
      # step turns that comment into a merge decision by reading the machine-readable verdict.
      #
      # Fails CLOSED on purpose: no verdict found is treated as ISSUES, not as a pass. The
      # whole point is that a reviewer which silently did nothing must never look like
      # approval — this workflow spent two entire runs reporting success while refusing every
      # PR, and only confessed once its own output was turned on.

      - name: Enforce the review verdict
        if: always()
        env:
          RUN_STARTED: ${{ needs.review.outputs.run_started }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FORGE_URL: ${{ secrets.FORGE_URL }}
          FORGE_API_KEY: ${{ secrets.FORGE_API_KEY }}
        run: |
          set -euo pipefail
          # ESCAPE HATCH — human-applied only. A PR that edits this workflow is skipped by
          # the platform's own validation guard (the file must match the default branch), so
          # it can never earn a verdict: without this, the reviewer itself would be
          # permanently unmergeable once the check is required. The label must have been
          # applied by a HUMAN — verified against the issue timeline — so the agent cannot
          # wave its own work through by labelling its own PR.
          OVERRIDER=$(gh api "repos/${{ github.repository }}/issues/${PR}/timeline"                         --jq '[.[] | select(.event == "labeled" and .label.name == "review:override")]
                              | last | select(.actor.type != "Bot") | .actor.login // empty' 2>/dev/null || true)
          if [ -n "$OVERRIDER" ]; then
            echo "::warning::Review gate OVERRIDDEN by @${OVERRIDER} via the review:override label — merged on a human decision, not a review."
            exit 0
          fi

          # Second door, same trust bar: an override recorded in the Forge console. It
          # carries the IAP-verified Google identity of whoever clicked — evidence a stolen
          # GitHub token cannot forge (the 2026-08-05 incident lesson: the worm HELD a token
          # with write access, so a label alone is weaker than an IAP session). Best-effort
          # on purpose: Forge being down must degrade to "no override found", never block
          # this check from evaluating the verdict — fail-closed stays with the verdict.
          if [ -n "${FORGE_URL:-}" ] && [ -n "${FORGE_API_KEY:-}" ]; then
            FOVR=$(curl -fsS --max-time 10 -H "X-Forge-API-Key: ${FORGE_API_KEY}"                      "${FORGE_URL}/api/v1/review-override?repo=${{ github.repository }}&pr=${PR}"                      | python3 -c "import json,sys;d=json.load(sys.stdin).get('override') or {};print(d.get('by',''))" 2>/dev/null || true)
            if [ -n "$FOVR" ]; then
              echo "::warning::Review gate OVERRIDDEN by ${FOVR} via the Forge console (IAP-verified) — merged on a human decision, not a review."
              exit 0
            fi
          fi

          BODY=$(gh api "repos/${{ github.repository }}/issues/${PR}/comments" --paginate --jq '[.[] | select(.user.login == "claude[bot]") | select(.created_at >= "'"${RUN_STARTED}"'")] | last | .body // ""')

          if [ -z "$BODY" ]; then
            echo "::error::The reviewer posted no comment — BLOCKED. A review that did not run is not an approval. If this PR edits the reviewer workflow, the platform skips it by design: a human can apply the review:override label."
            exit 1
          fi

          # CAPACITY vs CODE. Both models failing to answer looks identical to a failing
          # review from the outside — a red X on every PR in the fleet. On 2026-08-09 that
          # cost hours of hunting non-existent deploy failures. Name it explicitly so the
          # operator knows whether to fix code or top up the subscription.
          if printf '%s' "$BODY" | grep -qiE "encountered an error|execution failed"              && ! printf '%s' "$BODY" | grep -qE "REVIEW: (PASS|ISSUES)"; then
            echo "::error::NO REVIEWER AVAILABLE — both Fable 5 and the Opus 5 fallback failed to answer. This is a CAPACITY problem, not a finding: your code has not been judged. Check the Claude subscription budget, then re-run this job. Merge stays blocked because an unreviewed PR is not an approved one."
            printf '%s\n' "$BODY" | head -20
            exit 1
          fi

          if printf '%s' "$BODY" | grep -q "REVIEW: PASS"; then
            echo "✅ REVIEW: PASS — merge unblocked."
            exit 0
          fi

          if printf '%s' "$BODY" | grep -q "REVIEW: ISSUES"; then
            echo "::error::REVIEW: ISSUES — merge blocked. Fix the findings in the review comment and push; this re-runs automatically on every commit."
            printf '%s\n' "$BODY" | head -60
            exit 1
          fi

          echo "::error::No verdict line found in the review comment — treating as BLOCKED."
          printf '%s\n' "$BODY" | head -40
          exit 1
